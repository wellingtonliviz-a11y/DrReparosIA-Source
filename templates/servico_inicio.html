<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>{{ dados.titulo }} - Dr Reparos IA</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}.container{max-width:700px;margin:auto;padding:20px;text-align:center}.mascote{width:95px}.ia{color:#f58220}.card{background:#fff;padding:25px;border-radius:18px;margin-top:18px;box-shadow:0 4px 15px rgba(0,0,0,.10)}.intro{background:#fff4e8;border-left:5px solid #f58220;padding:15px;border-radius:8px;text-align:left;margin:18px 0}.opcao{display:block;width:100%;padding:16px;margin:12px 0;border:0;border-radius:10px;background:#f58220;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.voltar{display:inline-block;margin-top:20px;color:#555;text-decoration:none}</style></head><body><div class="container"><img src="/static/imagens/mascote.png" class="mascote"><h1>Dr Reparos <span class="ia">IA</span></h1><div class="card"><h2>{{ dados.icone }} {{ dados.titulo }}</h2><div class="intro">{{ dados.introducao }}</div>{% for chave, opcao in dados.opcoes.items() %}<a href="/diagnostico/servico/{{ servico }}/{{ chave }}" style="text-decoration:none"><button class="opcao">{{ opcao.titulo }}</button></a>{% endfor %}</div><a class="voltar" href="/diagnostico">← Voltar</a></div></body></html>
