<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dr Reparos IA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

      .container {
    max-width: 900px;
    margin: auto;
    padding: 15px 20px 25px;
    text-align: center;
}

.mascote {
    width: 135px;
    max-width: 45%;
    margin-bottom: 5px;
}

h1 {
    margin: 0 0 5px;
    font-size: 36px;
}

.subtitulo {
    color: #666;
    margin: 0 0 20px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 18px;
    margin: 10px auto;
    max-width: 600px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}
        .opcao {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .principal {
            background-color: #f58220;
            color: white;
        }

        .secundario {
            background-color: #222;
            color: white;
        }

        .presencial {
            background-color: #eeeeee;
            color: #222;
        }

        .rodape {
            margin-top: 30px;
            color: #777;
            font-size: 13px;
        }
        .card h2 {
    margin-top: 0;
    margin-bottom: 18px;
}

.opcao {
    padding: 15px;
    margin: 10px 0;
}

@media (max-width: 600px) {
    .container {
        padding: 10px 14px 20px;
    }

    .mascote {
        width: 110px;
    }

    h1 {
        font-size: 30px;
    }

    .subtitulo {
        font-size: 14px;
        margin-bottom: 15px;
    }

    .card {
        padding: 18px;
    }

    .opcao {
        font-size: 15px;
        padding: 14px;
    }
}
    </style>
</head>

<body>

    <div class="container">

        <img src="/static/imagens/mascote.png" class="mascote" alt="Mascote Dr Reparos">

        <h1>Dr Reparos <span class="ia">IA</span></h1>

        <p class="subtitulo">
            Tecnologia e experiência para ajudar você nos reparos da sua casa.
        </p>

        <div class="card">

            <h2>Como podemos ajudar?</h2>

             <a href="/diagnostico" style="text-decoration: none;">
             <button class="opcao principal">
             🤖 Resolver meu problema com a IA
             </button>
             </a>

            <a href="/videochamada" style="text-decoration: none;">
                <button class="opcao secundario">
                    📹 Falar com um especialista por videochamada
                </button>
            </a>

            <a href="/atendimento-presencial" style="text-decoration: none;">
                <button class="opcao presencial">
                    🧰 Solicitar atendimento presencial
                </button>
            </a>

        </div>

        <p class="rodape">
            Dr Reparos IA • Assistência residencial inteligente
        </p>

    </div>

</body>
</html>
