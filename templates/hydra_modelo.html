<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Modelo Hydra - Dr Reparos IA</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
            text-align: center;
        }

        .mascote {
            width: 100px;
        }

        h1 {
            margin: 5px 0;
        }

        .ia {
            color: #f58220;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        input {
            width: 100%;
            padding: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin: 15px 0;
        }

        input:focus {
            border-color: #f58220;
            outline: none;
        }

        .botao {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background-color: #f58220;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff4e8;
            border-radius: 10px;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <img
        src="/static/imagens/mascote.png"
        class="mascote"
        alt="Mascote Dr Reparos"
    >

    <h1>
        Dr Reparos <span class="ia">IA</span>
    </h1>

    <div class="card">

        <h2>Qual é o modelo da sua Hydra?</h2>

        <p>
            Digite abaixo exatamente o que você encontrou
            escrito ou identificado na tampa.
        </p>

        <form method="POST">

            <input
                type="text"
                name="modelo"
                placeholder="Ex.: Hydra Max"
                required
            >

            <button class="botao" type="submit">
                Continuar diagnóstico
            </button>

        </form>

      {% if modelo %}

<div class="resultado">

    Modelo informado:

    <strong>{{ modelo }}</strong>

    <br><br>

    Modelo registrado. Agora vamos identificar
    o problema da sua descarga.

    <br><br>

    <a href="/diagnostico/descarga/parede/hydra/problema"
       style="text-decoration: none;">

        <button class="botao">
            Continuar diagnóstico
        </button>

    </a>

</div>

{% endif %}

    </div>

    <a
        href="/diagnostico/descarga/parede/hydra"
        class="voltar">

        ← Voltar

    </a>

</div>

</body>
</html>
