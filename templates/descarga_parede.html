<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Válvula de Descarga - Dr Reparos IA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
            text-align: center;
        }

        .mascote {
            width: 100px;
        }

        h1 {
            margin: 5px 0;
        }

        .ia {
            color: #f58220;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        .opcao {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 10px;
            background-color: #f58220;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .nao-sei {
            background-color: #222;
        }

        .dica {
            background-color: #fff4e8;
            border-left: 5px solid #f58220;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin: 20px 0;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <img
        src="/static/imagens/mascote.png"
        class="mascote"
        alt="Mascote Dr Reparos"
    >

    <h1>Dr Reparos <span class="ia">IA</span></h1>

    <div class="card">

        <h2>Qual é a marca da sua válvula?</h2>

        <div class="dica">
            <strong>Dica:</strong>
            observe a tampa da descarga.
            Normalmente a marca aparece na parte externa.
        </div>

      <a href="/diagnostico/descarga/parede/hydra" style="text-decoration: none;">
    <button class="opcao">
        Hydra
    </button>
</a>

        <a href="/diagnostico/descarga/parede/modelo/docol-1-1-2" style="text-decoration: none;"><button class="opcao">Docol 1 1/2</button></a>

        <a href="/diagnostico/descarga/parede/modelo/docol-1-1-4-ri484" style="text-decoration: none;"><button class="opcao">Docol 1 1/4 RI484</button></a>

        <a href="/diagnostico/descarga/parede/modelo/lorenzetti-p21" style="text-decoration: none;"><button class="opcao">Lorenzetti P21</button></a>

        <a href="/diagnostico/descarga/parede/modelo/lorenzetti-p41" style="text-decoration: none;"><button class="opcao">Lorenzetti P41</button></a>

        <a href="/em-construcao/identificar-marca" style="text-decoration: none;"><button class="opcao nao-sei">📷 Não sei identificar a marca</button></a>

    </div>

    <a href="/diagnostico/descarga" class="voltar">
        ← Voltar
    </a>

</div>

</body>
</html>
