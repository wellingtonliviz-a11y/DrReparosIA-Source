<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Descarga - Dr Reparos IA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
            text-align: center;
        }

        .mascote {
            width: 100px;
        }

        h1 {
            margin: 5px 0;
        }

        .ia {
            color: #f58220;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        .opcao {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 10px;
            background-color: #f58220;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .ajuda {
            background-color: #222;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <img src="/static/imagens/mascote.png"
         class="mascote"
         alt="Mascote Dr Reparos">

    <h1>Dr Reparos <span class="ia">IA</span></h1>

    <div class="card">

        <h2>Vamos identificar sua descarga</h2>

        <p>Qual tipo de descarga você possui?</p>

        <a href="/diagnostico/servico/caixa-acoplada" style="text-decoration: none;">
            <button class="opcao">🚽 Caixa acoplada</button>
        </a>

        <a href="/diagnostico/descarga/parede" style="text-decoration: none;">
    <button class="opcao">
        🔘 Válvula de descarga na parede
    </button>
</a>

        <a href="/diagnostico/identificar-descarga" style="text-decoration: none;">
            <button class="opcao ajuda">❓ Não sei identificar</button>
        </a>

    </div>

    <a href="/diagnostico" class="voltar">
        ← Voltar
    </a>

</div>

</body>
</html>
