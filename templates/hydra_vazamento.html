<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diagnóstico Hydra - Dr Reparos IA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
            text-align: center;
        }

        .mascote {
            width: 90px;
        }

        .ia {
            color: #f58220;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        .alerta {
            background-color: #fff4e8;
            border-left: 5px solid #f58220;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin: 20px 0;
        }

        .opcao {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 10px;
            background-color: #f58220;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .nao-sei {
            background-color: #222;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <img
        src="/static/imagens/mascote.png"
        class="mascote"
        alt="Mascote Dr Reparos"
    >

    <h1>
        Dr Reparos <span class="ia">IA</span>
    </h1>

    <div class="card">

        <h2>💧 Água não para de cair dentro do vaso</h2>

        <p>
            Vamos identificar a possível causa antes
            de mexer na válvula.
        </p>

        <div class="alerta">
            <strong>Primeiro teste:</strong>

            <p>
                Sem apertar a descarga, observe a água
                que está caindo dentro do vaso.
            </p>
        </div>

        <h3>Como está esse vazamento?</h3>

        <a href="/diagnostico/descarga/parede/hydra/vazamento/fio"
   style="text-decoration: none;">

    <button class="opcao">
        💧 É um fio de água constante
    </button>

</a>

        <button class="opcao">
            🌊 Está caindo bastante água
        </button>

        <button class="opcao">
            ⏱️ Vaza por um tempo e depois para
        </button>

        <button class="opcao nao-sei">
            ❓ Não consigo identificar
        </button>

    </div>

    <a
        href="/diagnostico/descarga/parede/hydra/problema"
        class="voltar">
        ← Voltar
    </a>

</div>

</body>

</html>
